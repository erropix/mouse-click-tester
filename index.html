<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Event Counter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .event-area {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 60px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            border: 3px dashed #667eea;
            transition: all 0.3s ease;
        }

        .event-area:hover {
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .event-area p {
            font-size: 1.2em;
            color: #555;
            user-select: none;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .counters-column {
            display: flex;
            flex-direction: column;
        }

        .events-column {
            display: flex;
            flex-direction: column;
        }

        .counters {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .counter {
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .counter.mousedown {
            background: #3b82f6; /* Blue */
        }

        .counter.mouseup {
            background: #10b981; /* Green */
        }

        .counter.click {
            background: #8b5cf6; /* Purple */
        }

        .counter.dblclick {
            background: #ef4444; /* Red */
        }

        .counter:hover {
            transform: translateY(-5px);
        }

        .counter-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .counter-value {
            font-size: 2.5em;
            font-weight: bold;
        }

        .reset-btn {
            width: 100%;
            padding: 15px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reset-btn:hover {
            background: #ee5a52;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .reset-btn:active {
            transform: translateY(0);
        }

        .flash {
            animation: flash 0.3s ease;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .event-log {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            height: 100%;
        }

        .event-log-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 1em;
            text-align: center;
        }

        .event-log-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .event-log-item {
            padding: 10px;
            background: white;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            color: #555;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .event-log-item .event-name {
            font-weight: 600;
            text-transform: capitalize;
        }

        .event-log-item .event-name.mousedown {
            color: #3b82f6; /* Blue */
        }

        .event-log-item .event-name.mouseup {
            color: #10b981; /* Green */
        }

        .event-log-item .event-name.click {
            color: #8b5cf6; /* Purple */
        }

        .event-log-item .event-name.dblclick {
            color: #ef4444; /* Red */
        }

        .event-log-item .event-time {
            color: #999;
            font-size: 0.85em;
        }

        .event-log-empty {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖱️ Mouse Event Counter</h1>
        <p class="subtitle">Click and interact in the area below</p>
        
        <div class="event-area" id="eventArea">
            <p>👆 Click here to test mouse events</p>
        </div>

        <div class="content-grid">
            <div class="counters-column">
                <div class="counters">
                    <div class="counter dblclick" id="dblclickCounter">
                        <div class="counter-label">Double Click</div>
                        <div class="counter-value">0</div>
                    </div>
                    <div class="counter click" id="clickCounter">
                        <div class="counter-label">Click</div>
                        <div class="counter-value">0</div>
                    </div>
                    <div class="counter mousedown" id="mousedownCounter">
                        <div class="counter-label">Mousedown</div>
                        <div class="counter-value">0</div>
                    </div>
                    <div class="counter mouseup" id="mouseupCounter">
                        <div class="counter-label">Mouseup</div>
                        <div class="counter-value">0</div>
                    </div>
                </div>
            </div>

            <div class="events-column">
                <div class="event-log">
                    <div class="event-log-title">📋 Last 10 Events</div>
                    <ul class="event-log-list" id="eventLogList">
                        <li class="event-log-empty">Waiting for events...</li>
                    </ul>
                </div>
            </div>
        </div>

        <button class="reset-btn" id="resetBtn">Reset Counters</button>
    </div>

    <script>
        // Counter state
        const counters = {
            mousedown: 0,
            mouseup: 0,
            click: 0,
            dblclick: 0
        };

        // Event log state (keep last 10 events)
        const eventLog = [];
        const MAX_LOG_ENTRIES = 10;

        // Get elements
        const eventArea = document.getElementById('eventArea');
        const eventLogList = document.getElementById('eventLogList');
        const resetBtn = document.getElementById('resetBtn');

        // Function to update event log display
        function updateEventLog(eventType) {
            const now = new Date().toLocaleTimeString();
            
            // Add to the beginning of the array
            eventLog.unshift({ type: eventType, time: now });
            
            // Keep only last 10 events
            if (eventLog.length > MAX_LOG_ENTRIES) {
                eventLog.pop();
            }
            
            // Update the display
            if (eventLog.length === 0) {
                eventLogList.innerHTML = '<li class="event-log-empty">Waiting for events...</li>';
            } else {
                eventLogList.innerHTML = eventLog.map(event => `
                    <li class="event-log-item">
                        <span class="event-name ${event.type}">${event.type}</span>
                        <span class="event-time">${event.time}</span>
                    </li>
                `).join('');
            }
        }

        // Function to update counter display
        function updateCounter(eventType) {
            counters[eventType]++;
            const counterElement = document.getElementById(`${eventType}Counter`);
            const valueElement = counterElement.querySelector('.counter-value');
            valueElement.textContent = counters[eventType];
            
            // Add flash animation
            counterElement.classList.add('flash');
            setTimeout(() => counterElement.classList.remove('flash'), 300);
            
            // Update event log
            updateEventLog(eventType);
        }

        // Event listeners
        eventArea.addEventListener('mousedown', (e) => {
            updateCounter('mousedown');
        });

        eventArea.addEventListener('mouseup', (e) => {
            updateCounter('mouseup');
        });

        eventArea.addEventListener('click', (e) => {
            updateCounter('click');
        });

        eventArea.addEventListener('dblclick', (e) => {
            updateCounter('dblclick');
        });

        // Reset button
        resetBtn.addEventListener('click', () => {
            counters.mousedown = 0;
            counters.mouseup = 0;
            counters.click = 0;
            counters.dblclick = 0;
            
            document.querySelectorAll('.counter-value').forEach(el => {
                el.textContent = '0';
            });
            
            // Clear event log
            eventLog.length = 0;
            eventLogList.innerHTML = '<li class="event-log-empty">Counters and log reset!</li>';
            
            setTimeout(() => {
                eventLogList.innerHTML = '<li class="event-log-empty">Waiting for events...</li>';
            }, 2000);
        });
    </script>
</body>
</html>
